name: shariq_skeleton
description: "Live human skeleton tracking with Flutter and MediaPipe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  google_fonts: ^6.2.1

  flutter_mp_pose_landmarker:
    git:
      url: https://github.com/mohammed893/flutter_pose_mediapipe
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

